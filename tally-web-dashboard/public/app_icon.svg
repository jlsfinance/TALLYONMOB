<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#071612" />
  
  <!-- Decorative Ring -->
  <circle cx="512" cy="512" r="400" stroke="url(#primaryGradient)" stroke-width="20" opacity="0.1" />
  
  <!-- SYNCORA sync-loop mark -->
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M694 398C646 319 563 272 470 280C348 290 258 394 268 516" stroke="url(#primaryGradient)" stroke-width="82" />
    <path d="M330 626C378 705 461 752 554 744C676 734 766 630 756 508" stroke="url(#glowGradient)" stroke-width="82" />
  </g>
  <path d="M692 264L796 400L626 394L692 264Z" fill="#A3E635" />
  <path d="M332 760L228 624L398 630L332 760Z" fill="#22D3EE" />
</svg>
