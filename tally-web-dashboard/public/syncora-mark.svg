<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradient (Blue to Purple) -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glow Gradient (Light Blue to Light Purple) -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- 3D S-Ribbon Gradients -->
    <linearGradient id="sTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="sBot" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="sDarkFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dx="0" dy="12" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background (Clean App Squircle) -->
  <rect width="1024" height="1024" rx="200" fill="#030712" />

  <!-- Subtle Outer Sync Ring -->
  <circle cx="512" cy="420" r="320" stroke="url(#primaryGradient)" stroke-width="12" opacity="0.08" />

  <!-- Main 3D "S" Ribbon with Sync Arrows (From your image) -->
  <g filter="url(#shadow)" transform="translate(0, -15)">
    
    <!-- Back Dark 3D Folds (Creates depth behind the ribbon) -->
    <path d="M 355 250 C 310 315, 345 385, 450 420 L 580 465 C 555 510, 505 520, 445 520 L 410 475 Z" fill="url(#sDarkFold)" />
    <path d="M 665 495 C 695 560, 645 620, 540 620 L 420 530 L 595 450 Z" fill="url(#sDarkFold)" />

    <!-- Top Horizontal Bar of S -->
    <path d="M 605 200 H 445 C 370 200, 340 245, 355 285 C 370 255, 405 245, 455 245 H 605 Z" fill="url(#sTop)" />
    <rect x="420" y="200" width="190" height="92" rx="20" fill="url(#sTop)" />

    <!-- Top Right 3D Faceted Arrowhead -->
    <!-- Upper Facet -->
    <polygon points="600,150 735,246 655,246" fill="#60A5FA" />
    <!-- Lower Facet -->
    <polygon points="600,342 735,246 655,246" fill="#1E3A8A" />
    <!-- Left Base Facet -->
    <polygon points="600,150 655,246 600,342" fill="#2563EB" />

    <!-- Bottom Horizontal Bar of S -->
    <rect x="414" y="528" width="190" height="92" rx="20" fill="url(#sBot)" />

    <!-- Bottom Left 3D Faceted Arrowhead -->
    <!-- Upper Facet -->
    <polygon points="424,478 289,574 369,574" fill="#38BDF8" />
    <!-- Lower Facet -->
    <polygon points="424,670 289,574 369,574" fill="#1E3A8A" />
    <!-- Right Base Facet -->
    <polygon points="424,478 369,574 424,670" fill="#1D4ED8" />

    <!-- Main Center Diagonal Ribbon of S (Overlays Top & Bottom) -->
    <path d="M 435 200 C 350 200, 320 310, 425 360 L 605 445 C 700 490, 670 620, 565 620 H 510 C 605 620, 625 530, 545 490 L 385 415 C 300 375, 320 200, 435 200 Z" fill="url(#sMid)" />
  </g>

  <!-- Typography: SYNCORA (Exact clean geometric paths from your image) -->
  <g filter="url(#shadow)" transform="translate(0, 15)">
    <!-- S -->
    <path d="M 262 722 H 215 C 198 722, 190 729, 190 739 C 190 749, 198 755, 215 755 H 238 C 262 755, 276 768, 276 788 C 276 809, 260 822, 234 822 H 182 V 804 H 234 C 248 804, 256 798, 256 788 C 256 778, 248 773, 234 773 H 212 C 186 773, 170 760, 170 739 C 170 718, 186 704, 215 704 H 262 V 722 Z" fill="#FFFFFF" />

    <!-- Y -->
    <path d="M 294 704 H 316 L 348 754 L 380 704 H 402 L 358 772 V 822 H 338 V 772 L 294 704 Z" fill="#FFFFFF" />

    <!-- N -->
    <path d="M 424 822 V 704 H 442 L 504 786 V 704 H 524 V 822 H 506 L 444 740 V 822 H 424 Z" fill="#FFFFFF" />

    <!-- C -->
    <path d="M 632 724 C 622 716, 610 712, 596 712 C 568 712, 548 732, 548 763 C 548 794, 568 814, 596 814 C 610 814, 622 810, 632 802 L 644 816 C 631 826, 615 832, 596 832 C 556 832, 528 804, 528 763 C 528 722, 556 694, 596 694 C 615 694, 631 700, 644 710 L 632 724 Z" transform="translate(22, 0)" fill="#FFFFFF" />

    <!-- O (Solid Continuous Blue Gradient Ring - No Cuts!) -->
    <circle cx="728" cy="763" r="50" stroke="url(#glowGradient)" stroke-width="20" fill="none" />

    <!-- R -->
    <path d="M 806 822 V 704 H 856 C 880 704, 896 718, 896 740 C 896 758, 884 771, 866 775 L 898 822 H 875 L 845 777 H 826 V 822 H 806 Z M 826 722 V 760 H 854 C 868 760, 876 752, 876 740 C 876 728, 868 722, 854 722 H 826 Z" transform="translate(-8, 0)" fill="#FFFFFF" />

    <!-- A (Clean V-Apex without crossbar) -->
    <path d="M 902 822 L 950 704 H 968 L 1016 822 H 995 L 959 730 L 923 822 H 902 Z" transform="translate(-12, 0)" fill="#FFFFFF" />
  </g>

  <!-- Subtext: TALLY ON MOBILE -->
  <text x="512" y="910" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#94A3B8" letter-spacing="14">TALLY ON MOBILE</text>
</svg>