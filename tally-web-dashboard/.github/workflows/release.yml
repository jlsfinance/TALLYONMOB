name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: tally-web-dashboard

      - name: Build web assets
        run: npx vite build
        working-directory: tally-web-dashboard

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: tally-web-dashboard

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: tally-web-dashboard/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyLink.apk
          path: tally-web-dashboard/android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows App
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish
        working-directory: tally-windows-sync

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyLink.exe
          path: tally-windows-sync/publish/TallySyncApp.exe

  release:
    name: Create Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: TallyLink.apk
          path: ./artifacts

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: TallyLink.exe
          path: ./artifacts

      - name: Rename artifacts
        run: |
          mv ./artifacts/app-debug.apk ./artifacts/TallyLink.apk
          mv ./artifacts/TallySyncApp.exe ./artifacts/TallyLink.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/TallyLink.apk
            ./artifacts/TallyLink.exe
