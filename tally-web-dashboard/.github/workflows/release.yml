name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v
        working-directory: tally-mobile-app

      - name: Flutter pub get
        run: flutter pub get
        working-directory: tally-mobile-app

      - name: Build APK
        run: flutter build apk --release --verbose
        working-directory: tally-mobile-app

      - name: Find APK
        run: |
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f
          echo "=== Build outputs ==="
          ls -la tally-mobile-app/build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir not found"
          ls -la tally-mobile-app/build/app/outputs/apk/ 2>/dev/null || echo "apk dir not found"

      - name: Copy APK to artifacts
        run: |
          mkdir -p artifacts
          cp tally-mobile-app/build/app/outputs/flutter-apk/app-release.apk artifacts/TallyLink.apk 2>/dev/null || \
          cp tally-mobile-app/build/app/outputs/flutter-apk/app-release.apk artifacts/TallyLink.apk 2>/dev/null || \
          find tally-mobile-app -name "*.apk" -exec cp {} artifacts/TallyLink.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyLink.apk
          path: artifacts/TallyLink.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows App
        run: dotnet publish -c Release -r win-x64 --self-contained true -o ./publish
        working-directory: tally-windows-sync

      - name: Create ZIP
        run: Compress-Archive -Path ./publish/* -DestinationPath ./TallyLink.zip
        working-directory: tally-windows-sync

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyLink.zip
          path: tally-windows-sync/TallyLink.zip

  release:
    name: Create Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: TallyLink.apk
          path: ./artifacts

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: TallyLink.zip
          path: ./artifacts

      - name: Rename artifacts
        run: |
          ls -la ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/TallyLink.apk
            ./artifacts/TallyLink.zip
