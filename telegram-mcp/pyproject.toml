[project]
name = "telegram-mcp"
version = "0.1.0"
description = "Telegram MCP Server for TallyLink"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["main"]
