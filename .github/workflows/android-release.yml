name: Syncora Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tally-web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tally-web-dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - name: Build Syncora web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          npm run build
          npx --no-install cap sync android
      - name: Build Android APK for testing
        run: bash ./gradlew assembleDebug
        working-directory: tally-web-dashboard/android
      - uses: actions/upload-artifact@v4
        with:
          name: syncora-android-debug
          path: tally-web-dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
