name: Release TallyLink

on:
  push:
    tags:
      - 'v*' # Triggers on v2.1.8

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: |
        dotnet nuget locals all --clear
        dotnet restore tally-windows-sync/TallySyncApp/TallySyncApp.csproj --force
      shell: pwsh

    - name: Publish App
      run: |
        dotnet publish tally-windows-sync/TallySyncApp/TallySyncApp.csproj -c Release -r win-x64 --self-contained -o PublishOutput
      shell: pwsh

    - name: Create Squirrel Release
      run: |
        $VERSION = "${{ github.ref_name }}".Substring(1)
        
        # 1. Look for Squirrel.exe in the NuGet cache
        $SQUIRREL_EXE = (Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages\clowd.squirrel" -Filter "Squirrel.exe" -Recurse | Where-Object { $_.FullName -like "*tools*" } | Select-Object -First 1).FullName
        
        if (-not $SQUIRREL_EXE) {
            Write-Error "Squirrel.exe not found in NuGet cache."
            exit 1
        }
        
        # 2. Add WiX v3 to path
        $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
        
        Write-Host "Using Squirrel from: $SQUIRREL_EXE"
        
        # 3. Create Releases directory
        if (-not (Test-Path "Releases")) { New-Item -ItemType Directory -Path "Releases" }
        
        # 4. Step 1: Create the nupkg
        & $SQUIRREL_EXE pack --noDelta --packId="TallyLink" --packVersion="$VERSION" --packDir="PublishOutput" --releaseDir="Releases" --packAuthors="ShauryaTechSol" --packTitle="TallyLink"
        
        # 5. Step 2: Explicitly Releasify (This ensures Setup.exe is created)
        $NUPKG = (Get-ChildItem -Path "Releases" -Filter "*.nupkg" | Select-Object -First 1).FullName
        Write-Host "Releasifying: $NUPKG"
        & $SQUIRREL_EXE releasify --package="$NUPKG" --releaseDir="Releases"
        
        # 6. Renaming logic
        Get-ChildItem -Path "Releases" -Filter "*Setup.exe" | ForEach-Object {
            Move-Item $_.FullName "Releases/TallyLinkSetup.exe" -Force
            Write-Host "Renamed $($_.Name) to TallyLinkSetup.exe"
        }
        
        echo "Listing Releases directory:"
        ls Releases
      shell: pwsh

    - name: Update tallysyncapp folder
      run: |
        # Rule 16
        if (Test-Path "Releases/TallyLinkSetup.exe") {
            if (-not (Test-Path "tallysyncapp")) { New-Item -ItemType Directory -Path "tallysyncapp" }
            Copy-Item "Releases/TallyLinkSetup.exe" "tallysyncapp/TallyLink.exe" -Force
        }
      shell: pwsh

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          Releases/TallyLinkSetup.exe
          Releases/*.nupkg
          Releases/RELEASES
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Download URL in Supabase
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $DL_URL = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TallyLinkSetup.exe"
        $BODY = @{ value = $DL_URL } | ConvertTo-Json
        
        Invoke-RestMethod -Method Patch `
          -Uri "${{ secrets.SUPABASE_URL }}/rest/v1/app_settings?key=eq.windows_app_download_url" `
          -Headers @{ 
            "Authorization" = "Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}";
            "Content-Type" = "application/json";
            "Prefer" = "return=minimal"
          } `
          -Body $BODY
      shell: pwsh
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
