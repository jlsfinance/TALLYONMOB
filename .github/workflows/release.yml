name: Release TallyLink

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: |
        dotnet nuget locals all --clear
        dotnet restore tally-windows-sync/TallySyncApp/TallySyncApp.csproj --force
      shell: pwsh

    - name: Publish App
      run: |
        dotnet publish tally-windows-sync/TallySyncApp/TallySyncApp.csproj -c Release -r win-x64 --self-contained -o PublishOutput
      shell: pwsh

    - name: Create Squirrel Release
      run: |
        $VERSION = "${{ github.ref_name }}".Substring(1)
        $WORKSPACE = (Get-Location).Path
        
        # 1. Find Squirrel tools directory (not just the exe)
        $SQUIRREL_EXE_FILE = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages\clowd.squirrel" -Filter "Squirrel.exe" -Recurse | Where-Object { $_.FullName -like "*tools*" } | Select-Object -First 1
        
        if (-not $SQUIRREL_EXE_FILE) {
            Write-Error "Squirrel.exe not found in NuGet cache."
            exit 1
        }
        
        $SQUIRREL_DIR = $SQUIRREL_EXE_FILE.DirectoryName
        $SQUIRREL_EXE = $SQUIRREL_EXE_FILE.FullName
        
        Write-Host "Squirrel dir: $SQUIRREL_DIR"
        Write-Host "Squirrel exe: $SQUIRREL_EXE"
        Write-Host "Contents of Squirrel tools dir:"
        ls $SQUIRREL_DIR
        
        # 2. Add WiX v3 to path
        $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
        
        # 3. Create absolute paths for pack/release dirs
        $PACK_DIR = Join-Path $WORKSPACE "PublishOutput"
        $RELEASE_DIR = Join-Path $WORKSPACE "Releases"
        if (-not (Test-Path $RELEASE_DIR)) { New-Item -ItemType Directory -Path $RELEASE_DIR }
        
        # 4. CD into Squirrel tools dir so companion files (Update.exe, StubExecutable) are found
        Push-Location $SQUIRREL_DIR
        
        Write-Host "Running Squirrel pack from: $(Get-Location)"
        & .\Squirrel.exe pack --noDelta --packId="TallyLink" --packVersion="$VERSION" --packDir="$PACK_DIR" --releaseDir="$RELEASE_DIR" --packAuthors="ShauryaTechSol" --packTitle="TallyLink"
        
        Pop-Location
        
        # 5. Rename Setup.exe to URL-friendly name
        Get-ChildItem -Path $RELEASE_DIR -Filter "*Setup*" | ForEach-Object {
            Move-Item $_.FullName "$RELEASE_DIR\TallyLinkSetup.exe" -Force
            Write-Host "Renamed $($_.Name) to TallyLinkSetup.exe"
        }
        
        echo "Listing Releases directory:"
        ls $RELEASE_DIR
      shell: pwsh

    - name: Update tallysyncapp folder
      run: |
        if (Test-Path "Releases/TallyLinkSetup.exe") {
            if (-not (Test-Path "tallysyncapp")) { New-Item -ItemType Directory -Path "tallysyncapp" }
            Copy-Item "Releases/TallyLinkSetup.exe" "tallysyncapp/TallyLink.exe" -Force
        }
      shell: pwsh

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        generate_release_notes: true
        files: |
          Releases/TallyLinkSetup.exe
          Releases/*.nupkg
          Releases/RELEASES
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Download URL in Supabase
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $DL_URL = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TallyLinkSetup.exe"
        $BODY = @{ value = $DL_URL } | ConvertTo-Json
        
        Invoke-RestMethod -Method Patch `
          -Uri "${{ secrets.SUPABASE_URL }}/rest/v1/app_settings?key=eq.windows_app_download_url" `
          -Headers @{ 
            "Authorization" = "Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}";
            "Content-Type" = "application/json";
            "Prefer" = "return=minimal"
          } `
          -Body $BODY
      shell: pwsh
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
