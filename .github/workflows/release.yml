name: Release TallyLink

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v2.1.3

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: |
        dotnet nuget locals all --clear
        dotnet restore tally-windows-sync/TallySyncApp/TallySyncApp.csproj --force
      shell: pwsh

    - name: Publish App
      run: |
        dotnet publish tally-windows-sync/TallySyncApp/TallySyncApp.csproj -c Release -r win-x64 --self-contained -o PublishOutput
      shell: pwsh

    - name: Create Squirrel Release
      run: |
        $VERSION = "${{ github.ref_name }}".Substring(1)
        
        # 1. Look for Squirrel.exe in the NuGet cache specifically in tools
        $SQUIRREL_EXE = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages\clowd.squirrel" -Filter "Squirrel.exe" -Recurse | Where-Object { $_.FullName -like "*tools*" } | Select-Object -First 1
        
        if (-not $SQUIRREL_EXE) {
            Write-Error "Squirrel.exe not found in NuGet cache. Ensure Clowd.Squirrel is a dependency."
            exit 1
        }
        
        Write-Host "Using Squirrel from: $($SQUIRREL_EXE.FullName)"
        
        # 2. Run Squirrel pack (Adding --no-msi to avoid setup generation failures on CI)
        & $SQUIRREL_EXE.FullName pack --packId "TallyLink" --packVersion $VERSION --packAuthors "ShauryaTechSol" --packTitle "TallyLink" --releaseDir "Releases" --packDir "PublishOutput" --no-msi
        
        # 3. Rename to a URL-friendly name (Setup.exe might not exist if --no-msi is used, but TallyLinkSetup.exe is what we want)
        # Note: If Setup.exe is missing, we might need a different strategy, but usually nupkg is enough for updates.
        # However, for the landing page, we need the EXE.
        
        if (Test-Path "Releases/TallyLink Setup.exe") {
            Move-Item "Releases/TallyLink Setup.exe" "Releases/TallyLinkSetup.exe" -Force
        } elseif (Test-Path "Releases/Setup.exe") {
            Move-Item "Releases/Setup.exe" "Releases/TallyLinkSetup.exe" -Force
        }
        
        echo "Listing Releases directory:"
        ls Releases
      shell: pwsh

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          Releases/TallyLinkSetup.exe
          Releases/*.nupkg
          Releases/RELEASES
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Download URL in Supabase
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $DL_URL = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TallyLinkSetup.exe"
        $BODY = @{ value = $DL_URL } | ConvertTo-Json
        
        Invoke-RestMethod -Method Patch `
          -Uri "${{ secrets.SUPABASE_URL }}/rest/v1/app_settings?key=eq.windows_app_download_url" `
          -Headers @{ 
            "Authorization" = "Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}";
            "Content-Type" = "application/json";
            "Prefer" = "return=minimal"
          } `
          -Body $BODY
      shell: pwsh
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
