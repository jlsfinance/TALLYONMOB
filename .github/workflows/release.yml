name: Release TallyLink

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'tally-windows-sync/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  windows-build-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore and build Windows client
      shell: pwsh
      run: |
        dotnet restore tally-windows-sync/TallySyncApp.csproj --force
        dotnet build tally-windows-sync/TallySyncApp.csproj -c Release --no-restore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: |
        dotnet nuget locals all --clear
        dotnet restore tally-windows-sync/TallySyncApp.csproj --force
      shell: pwsh

    - name: Publish App
      run: |
        dotnet publish tally-windows-sync/TallySyncApp.csproj -c Release -r win-x64 --self-contained -o PublishOutput
      shell: pwsh

    - name: Create Squirrel Release
      run: |
        $ErrorActionPreference = 'Stop'
        $VERSION = "${{ github.ref_name }}".Substring(1)
        $WORKSPACE = (Get-Location).Path
        
        # Find Squirrel tools directory
        $SQUIRREL_EXE_FILE = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages\clowd.squirrel" -Filter "Squirrel.exe" -Recurse | Where-Object { $_.FullName -like "*tools*" } | Select-Object -First 1
        
        if (-not $SQUIRREL_EXE_FILE) { throw "Squirrel.exe is required; refusing to publish an unsigned executable as an installer" }
        
        $PACK_DIR = Join-Path $WORKSPACE "PublishOutput"
        $RELEASE_DIR = Join-Path $WORKSPACE "Releases"
        if (-not (Test-Path $RELEASE_DIR)) { New-Item -ItemType Directory -Path $RELEASE_DIR }
        
        $SQUIRREL_DIR = $SQUIRREL_EXE_FILE.DirectoryName
        Push-Location $SQUIRREL_DIR
        & .\Squirrel.exe pack --noDelta --packId="TallyLink" --packVersion="$VERSION" --packDir="$PACK_DIR" --releaseDir="$RELEASE_DIR" --packAuthors="ShauryaTechSol" --packTitle="TallyLink"
        if ($LASTEXITCODE -ne 0) { throw "Squirrel packaging failed with exit code $LASTEXITCODE" }
        Pop-Location
        
        Write-Host "Releases dir contents:"
        ls $RELEASE_DIR
        
        # Generate RELEASES file if nupkg exists but RELEASES doesn't
        $NUPKG = Get-ChildItem -Path $RELEASE_DIR -Filter "*.nupkg" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($NUPKG -and -not (Test-Path "$RELEASE_DIR\RELEASES")) {
            $hash = (Get-FileHash $NUPKG.FullName -Algorithm SHA1).Hash
            "$hash $($NUPKG.Name) $($NUPKG.Length)" | Out-File "$RELEASE_DIR\RELEASES" -Encoding utf8
            Write-Host "Generated RELEASES file"
        }
        
        $setupFile = Get-ChildItem -Path $RELEASE_DIR -Filter "*Setup*" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $setupFile) { throw "Squirrel did not produce a setup executable; refusing to publish fallback artifact" }
        Move-Item $setupFile.FullName "$RELEASE_DIR\TallyLinkSetup.exe" -Force
        Get-ChildItem $RELEASE_DIR -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content "$RELEASE_DIR\SHA256SUMS.txt"
        }
        
        Write-Host "Final Releases:"
        ls $RELEASE_DIR
        
        # Force success exit
        exit 0
      shell: pwsh

    - name: Update tallysyncapp folder
      run: |
        if (Test-Path "Releases/TallyLinkSetup.exe") {
            if (-not (Test-Path "tallysyncapp")) { New-Item -ItemType Directory -Path "tallysyncapp" }
            Copy-Item "Releases/TallyLinkSetup.exe" "tallysyncapp/TallyLink.exe" -Force
        }
      shell: pwsh

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        generate_release_notes: true
        files: |
          Releases/TallyLinkSetup.exe
          Releases/*.nupkg
          Releases/RELEASES
          Releases/SHA256SUMS.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Download URL in InsForge
      if: startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      run: |
        $DL_URL = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TallyLinkSetup.exe"
        $BODY = @{ value = $DL_URL } | ConvertTo-Json

        $BASE_URL_RAW = if ($env:INSFORGE_URL) { $env:INSFORGE_URL } else { $env:SUPABASE_URL }
        $BASE_URL = if ($BASE_URL_RAW) { $BASE_URL_RAW.TrimEnd('/') } else { "" }
        $API_KEY = if ($env:INSFORGE_ANON_KEY) { $env:INSFORGE_ANON_KEY } else { $env:SUPABASE_ANON_KEY }
        $AUTH_TOKEN = if ($env:INSFORGE_SERVICE_ROLE_KEY) { $env:INSFORGE_SERVICE_ROLE_KEY } else { $env:SUPABASE_SERVICE_ROLE_KEY }

        if (-not $BASE_URL) { throw "Missing INSFORGE_URL (or SUPABASE_URL) secret" }
        if (-not $API_KEY) { throw "Missing INSFORGE_ANON_KEY (or SUPABASE_ANON_KEY) secret" }


        $URI = "$BASE_URL/api/database/records/app_settings?key=eq.windows_app_download_url"

        $HEADERS = @{
          "apikey" = $API_KEY;
          "Content-Type" = "application/json";
          "Prefer" = "return=minimal"
        }

        if ($AUTH_TOKEN) {
          $HEADERS["Authorization"] = "Bearer $AUTH_TOKEN"
        }

        Invoke-RestMethod -Method Patch `
          -Uri $URI `
          -Headers $HEADERS `
          -Body $BODY

        Write-Host "Download URL updated in InsForge: $DL_URL"
      shell: pwsh
      env:
        INSFORGE_URL: ${{ secrets.INSFORGE_URL }}
        INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
        INSFORGE_SERVICE_ROLE_KEY: ${{ secrets.INSFORGE_SERVICE_ROLE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
