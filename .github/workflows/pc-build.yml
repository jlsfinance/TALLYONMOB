name: Build TallyLink PC app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet nuget locals all --clear
          dotnet restore tally-windows-sync/TallySyncApp.csproj --force

      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish tally-windows-sync/TallySyncApp.csproj -c Release -r win-x64 --self-contained -o PublishOutput

      - name: Package installer artifact
        shell: pwsh
        run: Compress-Archive -Path PublishOutput\* -DestinationPath TallyLink-PC-win-x64.zip -Force

      - name: Upload PC build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyLink-PC-win-x64
          path: TallyLink-PC-win-x64.zip
          retention-days: 14
