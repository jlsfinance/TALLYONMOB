name: Release TallyLink

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g. 2.0.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT: TallySyncApp.csproj
  APP_NAME: TallyLink
  MAIN_EXE: TallyLink.exe
  RID: win-x64

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^v',''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid semver: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build Release
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r ${{ env.RID }}
          --self-contained false
          -p:PublishSingleFile=false
          -o ./publish

      - name: Package with Squirrel
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $sq = Get-ChildItem -Path $env:USERPROFILE/.nuget/packages/clowd.squirrel -Recurse -Filter "Squirrel.exe" | Select-Object -First 1
          if (-not $sq) { throw "Squirrel.exe not found in NuGet cache" }
          New-Item -ItemType Directory -Force -Path ./squirrel-out | Out-Null
          & $sq.FullName pack `
            --packDir ./publish `
            --releaseDir ./squirrel-out `
            --packId ${{ env.APP_NAME }} `
            --packVersion $v `
            --mainExe ${{ env.MAIN_EXE }} `
            --releaseNotes "Release $v"
          if ($LASTEXITCODE -ne 0) { throw "Squirrel pack failed" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno installer
        shell: pwsh
        run: |
          $iss = "installer/TallyLink.iss"
          if (Test-Path $iss) {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          } else {
            Write-Host "No installer script found; skipping Inno build"
          }

      - name: Verify artifacts
        shell: pwsh
        run: |
          $errs = @()
          $sq = Get-ChildItem ./squirrel-out -File
          if (-not ($sq | Where-Object { $_.Name -match '\.nupkg$' })) { $errs += "Missing .nupkg" }
          if (-not (Test-Path ./squirrel-out/RELEASES)) { $errs += "Missing RELEASES" }
          $exe = Get-ChildItem -Path . -Recurse -Filter "TallyLink-Setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $errs += "Missing TallyLink-Setup.exe" }
          foreach ($f in $sq) { if ($f.Length -eq 0) { $errs += "Empty file: $($f.Name)" } }
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "All artifacts verified:"
          Get-ChildItem ./squirrel-out -File | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TallyLink v${{ steps.ver.outputs.version }}
          body: |
            TallyLink v${{ steps.ver.outputs.version }}

            Auto-update via Clowd.Squirrel (GitHub releases).
          files: |
            ./squirrel-out/*
            ./installer/output/TallyLink-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}