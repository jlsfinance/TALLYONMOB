name: tally_mobile_app
description: LiveKeeping Tally Sync Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.2.0
  intl: ^0.19.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Supabase (Optional if using Supabase Auth directly)
  supabase_flutter: ^2.3.0
  
  # UI Components
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  
  # Utils
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
