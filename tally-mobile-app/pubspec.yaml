name: tally_mobile
description: Tally ERP Mobile App - View your accounting data on the go

publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.2
  connectivity_plus: ^5.0.2
  flutter_dotenv: ^5.1.0
  share_plus: ^12.0.1
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  local_auth: ^3.0.0
  flutter_local_notifications: ^20.1.0
  firebase_messaging: ^16.1.1
  open_filex: ^4.7.0
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
